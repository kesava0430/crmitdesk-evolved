# /etc/nginx/sites-available/app.zenkara.in
#
# One host, many projects — the Tomcat-style layout:
#
#   /var/www/app.zenkara.in/
#   ├── zenkara/    -> this CRM  (symlink to /opt/zenkara-crm/client/dist)
#   ├── projectB/
#   └── projectC/
#
# `root` (not `alias`) is used deliberately: with root, the URI path maps
# straight onto the filesystem, so /zenkara/assets/x.js resolves to
# .../app.zenkara.in/zenkara/assets/x.js with no rewriting. `alias` plus
# try_files is the classic nginx footgun here.
#
# Adding a project later = drop its build in a folder + copy one location
# block. Nothing else changes.

server {
    # HTTP only until deploy/enable-https.sh has run; certbot then adds the
    # `listen 443 ssl` server block here and turns this one into a redirect.
    # Camera / geolocation / PWA features do not work over plain HTTP.
    listen 80;
    server_name app.zenkara.in;

    root /var/www/app.zenkara.in;

    client_max_body_size 25M;

    # Nothing is served at the bare host yet — send visitors to the CRM.
    # Replace with a landing page once there are several projects.
    location = / {
        return 302 /zenkara/;
    }

    # ─── Zenkara CRM ────────────────────────────────────────────────────
    #
    # ^~ matters: without it nginx's regex locations win for any API URL
    # ending in .png or .js (avatars, attachments) and they 404 as static
    # files instead of being proxied.
    #
    # The trailing slash on proxy_pass strips the /zenkara/api/ prefix, so
    # /zenkara/api/auth/login reaches the backend as /api/auth/login. The
    # backend is unchanged and does not know it is path-hosted.
    location ^~ /zenkara/api/ {
        proxy_pass http://127.0.0.1:4000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        # SSE (/api/events/stream) must stream, and idle gaps between
        # events must not hit the default 60s read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA: any unknown path under /zenkara/ hands back its index.html so
    # React Router can resolve the route client-side.
    location /zenkara/ {
        try_files $uri $uri/ /zenkara/index.html;
    }

    # Never cache the app shell or the service worker — a stale copy points
    # at hashed chunks purged by the next deploy (the white-screen classic).
    location = /zenkara/index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /zenkara/sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed filenames, so these are safe to cache hard.
    location ~* ^/zenkara/assets/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ─── Project B (template — uncomment when you deploy one) ───────────
    # location ^~ /projectB/api/ {
    #     proxy_pass http://127.0.0.1:4001/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    # }
    # location /projectB/ {
    #     try_files $uri $uri/ /projectB/index.html;
    # }
}

# Build the Android app on every push to main.
#
# The debug APK is attached to the run as an artifact, so there is always a
# current build to install without anyone opening Android Studio. Tag a
# release (v1.0.0) and it builds a SIGNED release bundle instead, ready for
# the Play Console — provided the keystore secrets are configured.
#
# Why this is separate from deploy.yml: the web deploy must be fast and must
# never be blocked by a Gradle build, and an APK is not something the server
# consumes. They share nothing but the source.
#
# ── Note on the API URL ─────────────────────────────────────────────────
# VITE_BASE_PATH is deliberately NOT set here. The Capacitor WebView serves
# the bundle from the root of its own origin (http://localhost), so the
# /zenkara/ base that the web build needs would break every asset path in
# the app. VITE_API_URL must be absolute for the same reason — a relative
# "/api" would resolve to the phone itself.
#
# ── Play Store releases (optional, only needed for tags) ────────────────
# Generate a keystore once and keep it safe — losing it means you can never
# update the app on Play again:
#
#   keytool -genkey -v -keystore zenkara.jks -keyalg RSA -keysize 2048 \
#     -validity 10000 -alias zenkara
#
# Then add these repository secrets (base64 the keystore first:
#   certutil -encode zenkara.jks zenkara.txt   on Windows):
#
#   ANDROID_KEYSTORE_BASE64   the encoded .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         e.g. zenkara
#   ANDROID_KEY_PASSWORD

name: Android

# Every push to main that changes the app ships it to Google Play
# PRODUCTION (after Google's review). Server-only or docs-only pushes skip
# this workflow: the installed app talks to the live API, so a backend change
# reaches app users without a new store release — and every pointless upload
# would just restart Play's review queue. Run it by hand (Actions → Android →
# Run workflow) to force a release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

# The job reads the source and uploads run artifacts; the Play upload
# authenticates with its own service account, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: https://app.zenkara.in/zenkara/api
  # Which Play track uploads go to: production (live after Google's review)
  # or internal (testers only, no review).
  PLAY_TRACK: production
  # Tags name the version (v1.2.0 -> "1.2.0"); main builds are 1.1.<run>.
  # The versionCode is computed in the "Compute version" step below.
  ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.1.{0}', github.run_number) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # JDK 17 is what Android Gradle Plugin 8 requires.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK; this step only adds
      # what's missing and accepts the licences. Its default package list
      # includes the legacy "tools" package, which Google has removed from
      # the SDK repository, so sdkmanager exits 1 ("Failed to find package
      # 'tools'") and every run failed here. Ask only for current packages;
      # Gradle fetches anything else it needs (compile SDK, build tools).
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      # Install ONCE at the root — npm workspaces monorepo.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      # Every build gets a strictly higher versionCode (Play requirement)
      # without anyone editing build.gradle; +100 keeps it above the
      # hand-set codes used before (the last was 3). build.gradle reads both.
      - name: Compute version
        run: |
          echo "ANDROID_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${ANDROID_VERSION_NAME#v}" >> "$GITHUB_ENV"

      # ── Push notifications (optional) ──────────────────────────────────
      # Add the repository secret GOOGLE_SERVICES_JSON_BASE64 (base64 of the
      # google-services.json downloaded from the Firebase console for package
      # com.zenkara.app) to turn FCM on. The bundle is only built with
      # VITE_FCM_ENABLED=true when the file is really there: registering for
      # push in an APK without it crashes the app natively.
      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > client/android/app/google-services.json
          fi
          # Also honours a google-services.json committed to the repo.
          if [ -s client/android/app/google-services.json ]; then
            echo "VITE_FCM_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "VITE_FCM_ENABLED=false" >> "$GITHUB_ENV"
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret - building without push notifications."
          fi

      # No VITE_BASE_PATH: the app is served from the WebView root.
      # Note the app ships THIS bundle: web deploys never reach installed
      # apps — users get changes only with a new APK/AAB (tag a release).
      - name: Build web bundle for the app
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: npm run build --workspace=client

      # Copies dist/ into the native project. Skipping this is the classic
      # Capacitor mistake — the APK silently ships the previous bundle.
      - name: Sync to the Android project
        run: npx cap sync android
        working-directory: client

      # ── Debug build (every push to main) ───────────────────────────────
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android

      - name: Upload debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: zenkara-debug-${{ github.sha }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Signed release + Google Play upload ───────────────────────────
      #
      # Every push to main (that touches the app) builds a signed bundle and,
      # when the Play credentials are configured, uploads it to the Play
      # PRODUCTION track. Google reviews each update (usually hours) and then
      # rolls it out to all users. A newer upload replaces one still in
      # review. To go back to testers-first, set PLAY_TRACK below to
      # 'internal' and promote releases in the Play Console.
      #
      # Each step checks whether its secrets exist, so the workflow still
      # passes (debug APK only) until they're added:
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      #   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD   -> signing
      #   PLAY_SERVICE_ACCOUNT_JSON                  -> upload to Play
      # versionCode is 100 + the run number (see "Compute version"), so every
      # upload is higher than the last, as Play requires.
      - name: Check release secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "sign=$([ -n "$KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "play=$([ -n "$PLAY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYSTORE" ]; then echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - skipping the signed bundle and Play upload."; fi
          if [ -n "$KEYSTORE" ] && [ -z "$PLAY" ]; then echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret - the signed bundle is attached to the run but not uploaded to Play."; fi

      - name: Decode keystore
        if: steps.secrets.outputs.sign == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > client/android/zenkara.jks
          test -s client/android/zenkara.jks

      - name: Build signed release bundle
        if: steps.secrets.outputs.sign == 'true'
        env:
          ZENKARA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZENKARA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZENKARA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/zenkara.jks \
            -Pandroid.injected.signing.store.password="$ZENKARA_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ZENKARA_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ZENKARA_KEY_PASSWORD"
        working-directory: client/android

      - name: Attach release bundle to the run
        if: steps.secrets.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zenkara-release-${{ env.ANDROID_VERSION_NAME }}
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload to Google Play
        if: steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.play == 'true'
        # Third-party action handed the Play service-account key: pinned to
        # the commit of v1.1.3 so a moved/compromised tag cannot swap the code.
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zenkara.app
          releaseFiles: client/android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.ANDROID_VERSION_NAME }} (${{ env.ANDROID_VERSION_CODE }})
          track: ${{ env.PLAY_TRACK }}
          status: completed

      # The keystore must never survive into a cached layer or log.
      - name: Remove keystore
        if: always()
        run: rm -f client/android/zenkara.jks

# Build the Android app on every push to main.
#
# The debug APK is attached to the run as an artifact, so there is always a
# current build to install without anyone opening Android Studio. Tag a
# release (v1.0.0) and it builds a SIGNED release bundle instead, ready for
# the Play Console — provided the keystore secrets are configured.
#
# Why this is separate from deploy.yml: the web deploy must be fast and must
# never be blocked by a Gradle build, and an APK is not something the server
# consumes. They share nothing but the source.
#
# ── Note on the API URL ─────────────────────────────────────────────────
# VITE_BASE_PATH is deliberately NOT set here. The Capacitor WebView serves
# the bundle from the root of its own origin (http://localhost), so the
# /zenkara/ base that the web build needs would break every asset path in
# the app. VITE_API_URL must be absolute for the same reason — a relative
# "/api" would resolve to the phone itself.
#
# ── Play Store releases (optional, only needed for tags) ────────────────
# Generate a keystore once and keep it safe — losing it means you can never
# update the app on Play again:
#
#   keytool -genkey -v -keystore zenkara.jks -keyalg RSA -keysize 2048 \
#     -validity 10000 -alias zenkara
#
# Then add these repository secrets (base64 the keystore first:
#   certutil -encode zenkara.jks zenkara.txt   on Windows):
#
#   ANDROID_KEYSTORE_BASE64   the encoded .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         e.g. zenkara
#   ANDROID_KEY_PASSWORD

name: Android

# Pushes to main build a debug APK; version tags (v1.0.0) build a signed
# release bundle for the Play Console.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: https://app.zenkara.in/zenkara/api
  # Tags name the version (v1.2.0 -> "1.2.0"); main builds are 1.1-dev.<run>.
  # The versionCode is computed in the "Compute version" step below.
  ANDROID_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.1-dev.{0}', github.run_number) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # JDK 17 is what Android Gradle Plugin 8 requires.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK; this step only adds
      # what's missing and accepts the licences. Its default package list
      # includes the legacy "tools" package, which Google has removed from
      # the SDK repository, so sdkmanager exits 1 ("Failed to find package
      # 'tools'") and every run failed here. Ask only for current packages;
      # Gradle fetches anything else it needs (compile SDK, build tools).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Install ONCE at the root — npm workspaces monorepo.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      # Every build gets a strictly higher versionCode (Play requirement)
      # without anyone editing build.gradle; +100 keeps it above the
      # hand-set codes used before (the last was 3). build.gradle reads both.
      - name: Compute version
        run: |
          echo "ANDROID_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${ANDROID_VERSION_NAME#v}" >> "$GITHUB_ENV"

      # ── Push notifications (optional) ──────────────────────────────────
      # Add the repository secret GOOGLE_SERVICES_JSON_BASE64 (base64 of the
      # google-services.json downloaded from the Firebase console for package
      # com.zenkara.app) to turn FCM on. The bundle is only built with
      # VITE_FCM_ENABLED=true when the file is really there: registering for
      # push in an APK without it crashes the app natively.
      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > client/android/app/google-services.json
          fi
          # Also honours a google-services.json committed to the repo.
          if [ -s client/android/app/google-services.json ]; then
            echo "VITE_FCM_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "VITE_FCM_ENABLED=false" >> "$GITHUB_ENV"
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret - building without push notifications."
          fi

      # No VITE_BASE_PATH: the app is served from the WebView root.
      # Note the app ships THIS bundle: web deploys never reach installed
      # apps — users get changes only with a new APK/AAB (tag a release).
      - name: Build web bundle for the app
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: npm run build --workspace=client

      # Copies dist/ into the native project. Skipping this is the classic
      # Capacitor mistake — the APK silently ships the previous bundle.
      - name: Sync to the Android project
        run: npx cap sync android
        working-directory: client

      # ── Debug build (every push to main) ───────────────────────────────
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android

      - name: Upload debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: zenkara-debug-${{ github.sha }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release build (version tags only) ──────────────────────────────
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > client/android/zenkara.jks
          test -s client/android/zenkara.jks

      - name: Build signed release bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ZENKARA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZENKARA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZENKARA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/zenkara.jks \
            -Pandroid.injected.signing.store.password="$ZENKARA_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ZENKARA_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ZENKARA_KEY_PASSWORD"
        working-directory: client/android

      - name: Upload release bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: zenkara-release-${{ github.ref_name }}
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # The keystore must never survive into a cached layer or log.
      - name: Remove keystore
        if: always()
        run: rm -f client/android/zenkara.jks

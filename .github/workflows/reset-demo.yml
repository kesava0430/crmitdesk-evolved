name: Reset demo data

# Nightly re-seed of every public demo showcase org (one per industry
# vertical — see server/src/utils/seedDemoData.ts) so the "Try Demo" button
# always drops visitors into a clean, realistic workspace, even after other
# visitors have poked at it during the day. Hits POST /api/demo/reset on the
# live API — see server/src/modules/demo for the endpoint itself.
#
# Requires a repo secret DEMO_RESET_SECRET whose value matches the
# DEMO_RESET_SECRET environment variable in the server's .env on the EC2
# instance (/opt/zenkara-crm/server/.env).
# Without that secret configured, the API endpoint refuses every request
# (404), so this workflow failing with a 404 almost always means the two
# secrets don't match yet or DEMO_RESET_SECRET isn't set on the server.

on:
  schedule:
    # 03:00 UTC every day — adjust to whatever "overnight" means for your
    # primary customer time zone.
    - cron: '0 3 * * *'
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

# Calls the live API with a shared secret; needs no GITHUB_TOKEN scopes.
permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call demo reset endpoint
        env:
          # Public base URL of the app. Defaults to production; set the repo
          # variable SITE_URL (Settings → Variables) to point elsewhere.
          SITE_URL: ${{ vars.SITE_URL || 'https://app.zenkara.in' }}
          DEMO_RESET_SECRET: ${{ secrets.DEMO_RESET_SECRET }}
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${SITE_URL%/}/zenkara/api/demo/reset" \
            -H "X-Demo-Reset-Secret: $DEMO_RESET_SECRET")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" != "200" ]; then
            echo "Demo reset failed"
            exit 1
          fi

# Keeps the Render free-tier backend awake.
#
# Render's free web services spin down after ~15 minutes without traffic;
# the next visitor then waits 50–90 seconds for a cold start (node boot +
# `prisma migrate deploy`). This workflow pings /health on a schedule so the
# instance stays warm during the hours people actually use the app.
#
# Notes:
# - GitHub cron is best-effort: runs can be delayed several minutes under
#   load, so the "*/10" below occasionally stretches past Render's 15-minute
#   idle window — pair it with a free UptimeRobot monitor (true 5-minute
#   pings) if you want zero cold starts.
# - A service kept awake 24/7 uses ~720 instance-hours/month, inside
#   Render's 750-hour free allowance for one service. If you'd rather save
#   hours, narrow the cron to working hours (see the commented variant).
# - The client static site never sleeps; only the API service needs this.
name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'          # every 10 minutes, around the clock
    # Working-hours variant (08:00–22:00 IST = 02:30–16:30 UTC), weekdays:
    # - cron: '*/10 3-16 * * 1-6'
  workflow_dispatch: {}             # manual "Run workflow" button for testing

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          # 3 attempts: the first request may itself be the one that wakes a
          # just-spun-down instance, and can take up to ~90s to answer.
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 100 \
              https://crm-itdesk-server.onrender.com/health) && [ "$code" = "200" ] && {
                echo "Healthy: $(cat /tmp/health.json)"; exit 0; }
            echo "Attempt $i: HTTP ${code:-timeout} — retrying in 15s"
            sleep 15
          done
          echo "Backend did not answer after 3 attempts" >&2
          exit 1

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json;

    # Security headers. NOTE: nginx's add_header is NOT inherited into any
    # location that declares its own add_header, so these are repeated in
    # those locations below — keep the two lists in sync.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TODO: add a Content-Security-Policy once the inline theme-bootstrap
    # script in index.html is hash-allowlisted — a blanket 'unsafe-inline'
    # CSP adds little, and a strict one without the hash breaks theming.

    # Proxy /api to backend.
    # ^~ is required: without it, nginx's regex locations (the asset-caching
    # one below) take precedence over this prefix match, so any API URL
    # ending in .png/.js/etc (avatars, attachments) was served as a static
    # 404 instead of being proxied. ^~ stops regex evaluation for /api/.
    location ^~ /api/ {
        proxy_pass http://server:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/events/stream): responses must stream, and idle gaps
        # between events must not hit the default 60s read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # index.html must never be cached: a stale cached copy references old
    # hashed chunks that are purged on the next deploy — the classic
    # white-screen-after-release. no-cache still allows conditional requests
    # (ETag), so it stays fast. Same treatment for the service worker and
    # manifest, which also change on deploy and are fetched by filename.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite emits content-hashed filenames,
    # so immutable is safe here — a changed file gets a new URL).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# /etc/nginx/snippets/zenkara-security-headers.conf
#
# Security headers for the static single-page app (index.html, sw.js, hashed
# assets). The API needs none of this from nginx — Express sets the same set
# with helmet (server/src/index.ts).
#
# `include` this in EVERY location that serves app files and in any location
# that has its own add_header: nginx drops all inherited add_header lines in
# a location that declares even one of its own.
#
# Requires deploy/nginx-zenkara-maps.conf in /etc/nginx/conf.d/.
add_header Content-Security-Policy "frame-ancestors $zenkara_frame_ancestors; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options $zenkara_x_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore HSTS on plain http, so this is harmless before certbot has
# run and takes effect as soon as the site is on https. No includeSubDomains:
# other zenkara.in hosts may not all be on https.
add_header Strict-Transport-Security "max-age=31536000" always;

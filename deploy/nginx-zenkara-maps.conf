# /etc/nginx/conf.d/zenkara-maps.conf  — http-level, installed ONCE per box
# (both site files share it; defining a map twice is an nginx error).
#
# The single-page app is one index.html for every route, so per-route
# headers have to key off the ORIGINAL request URI ($request_uri survives the
# try_files fallback to index.html; $uri does not).
#
# Public web forms (/zenkara/form/<id>) are meant to be framed by customers'
# own websites (Admin → Web Forms → embed snippet), so they alone may be
# framed by anyone. Everything else — the logged-in app, the portal, password
# reset — may only be framed by itself, which stops clickjacking ("click this
# button" overlays on top of an invisible Approve payroll / Delete dialog).
map $request_uri $zenkara_frame_ancestors {
    default                  "'self'";
    ~^/zenkara/form/         "*";
}
# An empty value makes nginx omit the header entirely.
map $request_uri $zenkara_x_frame_options {
    default                  "SAMEORIGIN";
    ~^/zenkara/form/         "";
}

# /etc/nginx/sites-available/360.zenkara.in
#
# Second hostname for the same application. app.zenkara.in keeps working;
# this adds 360.zenkara.in alongside it, serving the identical files and
# proxying to the same backend on 127.0.0.1:4000.
#
# ── Why /zenkara and not the root ───────────────────────────────────────
#
# The deployed bundle is built with VITE_BASE_PATH=/zenkara/, which Vite
# bakes into every asset URL — index.html asks for /zenkara/assets/*.js.
# Serving it at the root would return index.html fine and then 404 every
# script and stylesheet, giving a blank page.
#
# To move this host to the root later: rebuild with VITE_BASE_PATH unset
# and VITE_API_URL=/api, then replace the two /zenkara/ locations below
# with `location /` and `location ^~ /api/`.
#
# ── Install ─────────────────────────────────────────────────────────────
#   ln -sfn /etc/nginx/sites-available/360.zenkara.in /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d 360.zenkara.in --agree-tos -m zenkaratech@gmail.com --redirect
#
# Certbot rewrites this file in place, adding the listen 443 block and the
# certificate lines, and converting this one into an HTTP->HTTPS redirect.

server {
    listen 80;
    server_name 360.zenkara.in;

    # Same document root as app.zenkara.in — /var/www/app.zenkara.in/zenkara
    # is a symlink to /opt/zenkara-crm/client/dist, so both hosts serve
    # whatever the last deploy produced. Nothing is duplicated on disk.
    root /var/www/app.zenkara.in;

    client_max_body_size 25M;

    # The bare host has nothing of its own — send visitors to the app.
    location = / {
        return 302 /zenkara/;
    }

    # ─── Backend API ────────────────────────────────────────────────────
    #
    # ^~ is required and must precede `location /zenkara/`: without it the
    # regex asset block below wins for any API URL ending in .png or .js
    # (avatars, attachments) and they 404 as static files.
    #
    # The trailing slash on proxy_pass strips the /zenkara/api/ prefix, so
    # /zenkara/api/auth/login reaches the backend as /api/auth/login. The
    # backend is unchanged and does not know it is path-hosted.
    location ^~ /zenkara/api/ {
        proxy_pass http://127.0.0.1:4000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        # SSE (/api/events/stream) must stream, and idle gaps between
        # events must not hit the default 60s read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: any unknown path under /zenkara/ returns index.html so
    # React Router can resolve the route client-side.
    location /zenkara/ {
        try_files $uri $uri/ /zenkara/index.html;
    }

    # Never cache the app shell or the service worker — a stale copy points
    # at hashed chunks purged by the next deploy (the white-screen classic).
    location = /zenkara/index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /zenkara/sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed filenames, so these are safe to cache hard.
    location ~* ^/zenkara/assets/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
